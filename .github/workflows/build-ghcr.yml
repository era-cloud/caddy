name: build-ghcr

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'      # 每周一 03:00 UTC（北京 11:00）：跟随 caddy:latest 自动重建
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/era-cloud/caddy:latest
            ghcr.io/era-cloud/caddy:build-${{ github.run_number }}
