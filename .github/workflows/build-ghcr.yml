name: build-ghcr

# 每 3 小时检查上游 caddy 版本；只有版本变化才构建（避免无意义重启 gateway）
on:
  push:
    branches: [main]
    paths-ignore: ['BASE_VERSION']
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream caddy version
        id: ver
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, urllib.request
          tok = json.load(urllib.request.urlopen(
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/caddy:pull"))["token"]
          def get(url, accept):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}", "Accept": accept})
              return json.load(urllib.request.urlopen(req))
          idx = get("https://registry-1.docker.io/v2/library/caddy/manifests/latest",
                    "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json")
          amd = next(m["digest"] for m in idx["manifests"]
                     if m.get("platform",{}).get("architecture")=="amd64" and m["platform"].get("os")=="linux")
          man = get(f"https://registry-1.docker.io/v2/library/caddy/manifests/{amd}",
                    "application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json")
          cfg = get(f"https://registry-1.docker.io/v2/library/caddy/blobs/{man['config']['digest']}",
                    "application/vnd.oci.image.manifest.v1+json")
          v = (cfg.get("config",{}).get("Labels") or {}).get("org.opencontainers.image.version","")
          print(f"version={v}")
          print(f"tag={v.lstrip('v')}")
          PY

      - name: Check if changed
        id: chk
        run: |
          prev=$(cat BASE_VERSION 2>/dev/null || echo "")
          now="${{ steps.ver.outputs.version }}"
          echo "prev=[$prev] now=[$now]"
          if [ "$now" = "$prev" ] && [ -n "$now" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.chk.outputs.changed == 'true'
      - uses: docker/login-action@v3
        if: steps.chk.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.chk.outputs.changed == 'true'
        with:
          context: .
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.ver.outputs.tag }}
          tags: |
            ghcr.io/era-cloud/caddy:latest
            ghcr.io/era-cloud/caddy:${{ steps.ver.outputs.tag }}

      - name: Record base version
        if: steps.chk.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "${{ steps.ver.outputs.version }}" > BASE_VERSION
          git add BASE_VERSION
          git commit -m "chore: caddy ${{ steps.ver.outputs.version }} [skip ci]"
          git push
